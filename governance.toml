[project]
name = "production-governance-template"
default_branch = "main"

[gate]
report_json = "reports/pr-gate.json"
report_markdown = "reports/pr-gate.md"
base_ref = "HEAD~1"
require_clean_tree_on_gate = true
ignore_dirty_paths = ["reports/"]
forbidden_paths = [".env", ".env.*", "secrets/", "private_keys/", "data/production/"]
forbidden_extensions = [".pem", ".key", ".p12", ".pfx"]
allowed_branch_patterns = ["main", "feature/*", "fix/*", "governance/*", "docs/*", "test/*", "chore/*"]

[[commands.fast]]
name = "compileall"
argv = ["python", "-m", "compileall", "-q", "scripts", "tests"]

[[commands.slice]]
name = "governance-tests"
argv = ["python", "-m", "pytest", "-q", "tests"]

[[commands.gate]]
name = "full-tests"
argv = ["python", "-m", "pytest", "-q"]

[[audits.regex]]
name = "no-blanket-exception-suppression"
glob = "**/*.py"
pattern = "contextlib\\.suppress\\(Exception\\)"
severity = "warning"
message = "Broad exception suppression hides unexpected failures."

[[audits.regex]]
name = "no-raw-secret-files"
glob = "**/*"
pattern = "-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----"
severity = "error"
message = "Private key material must never be committed."

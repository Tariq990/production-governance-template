name: Bug report
description: Report a reproducible defect
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: input
    id: sha
    attributes:
      label: Exact commit SHA
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: Proposed permanent regression protection
      description: Test, static audit, or policy rule that prevents recurrence.

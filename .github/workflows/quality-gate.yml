name: quality-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GATE_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
      GATE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install governance dependencies
        run: python -m pip install pytest ruff mypy

      - name: Load owner-approved task contract
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          encoded_branch="${GITHUB_HEAD_REF//\//__}"
          contract="governance/contracts/${encoded_branch}.json"
          legacy_branch="${GITHUB_HEAD_REF//\//_}"
          legacy_contract="governance/contracts/${legacy_branch}.json"
          if git cat-file -e "origin/${GITHUB_BASE_REF}:${contract}" 2>/dev/null; then
            git show "origin/${GITHUB_BASE_REF}:${contract}" > .gate/ci-contract.json
          elif git cat-file -e "origin/${GITHUB_BASE_REF}:${legacy_contract}" 2>/dev/null; then
            git show "origin/${GITHUB_BASE_REF}:${legacy_contract}" > .gate/ci-contract.json
          elif [[ "${GITHUB_HEAD_REF}" == "governance/contract-administration" ]]; then
            git show "origin/${GITHUB_BASE_REF}:.gate/task-contract.example.json" > .gate/ci-contract.json
          else
            echo "BLOCKED: owner-approved contract not found at ${contract}" >&2
            exit 1
          fi
          test -s .gate/ci-contract.json

      - name: Run authoritative quality gate
        if: github.event_name == 'pull_request'
        env:
          GATE_TRUSTED_CONTRACT_PATH: .gate/ci-contract.json
        run: python scripts/pr_gate_ci.py

      - name: Run default-branch quality gate
        if: github.event_name != 'pull_request'
        env:
          GATE_BASE_REF: HEAD~1
        run: python scripts/pr_gate.py --level gate

      - name: Print machine-readable result
        if: always()
        run: test ! -f reports/pr-gate.json || cat reports/pr-gate.json

name: quality-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout without third-party actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=2 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Show runtime
        run: |
          python3 --version
          git rev-parse HEAD

      - name: Run authoritative dependency-free gate
        run: python3 scripts/pr_gate.py --level gate

      - name: Print machine-readable result
        if: always()
        run: test ! -f reports/pr-gate.json || cat reports/pr-gate.json

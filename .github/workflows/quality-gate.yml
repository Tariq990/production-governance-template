name: quality-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show runtime
        run: |
          python3 --version
          git rev-parse HEAD

      - name: Run authoritative dependency-free gate
        run: python3 scripts/pr_gate.py --level gate

      - name: Print machine-readable result
        if: always()
        run: test ! -f reports/pr-gate.json || cat reports/pr-gate.json
